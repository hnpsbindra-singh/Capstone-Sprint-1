spring.application.name=VictimService
server.address=0.0.0.0
server.port=${PORT:5005}

spring.mongodb.uri=${MONGODB_URI}

jwt.secret=${JWT_SECRET}
jwt.expirationMs=86400000

auth.service.url=${AUTH_SERVICE_URL:https://capstone-sprint-1.vercel.app}
ai.service.url=${AI_SERVICE_URL:https://flood-severity-analyzer.vercel.app/api/v1/score-base64}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
